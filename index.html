<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script type="text/javascript" src="lib/p5.min.js"></script>
        <script type="text/javascript" src="src/CubeGlobals.js"></script>
        <script type="text/javascript" src="src/CubeNotation.js"></script>
        <script type="text/javascript" src="src/Sticker.js"></script>
        <script type="text/javascript" src="src/Cubie.js"></script>
        <script type="text/javascript" src="src/RubiksCube.js"></script>
        <script type="text/javascript" src="src/RubiksCube3.js"></script>
        <script type="text/javascript" src="src/PatternAlgorithm.js"></script>
        <script type="text/javascript" src="src/solvers/SolverUtils.js"></script>
        <script type="text/javascript" src="src/solvers/Solver1x1.js"></script>
        <script type="text/javascript" src="src/solvers/Solver2x2LBL.js"></script>
        <script type="text/javascript" src="src/solvers/Solver3x3Blind.js"></script>
        <script type="text/javascript" src="src/solvers/Solver3x3CFOP.js"></script>
        <script type="text/javascript" src="src/solvers/Solver3x3Roux.js"></script>
        <script type="text/javascript" src="src/UI.js"></script>
        <script type="text/javascript" src="src/sketch.js"></script>
    </head>
    <body>
        <div class="header">
            <h2 class="header-title">Rubik's Cube Solver</h2>
            <h5 class="header-subtitle">Created by Amy Burnett</h5>
        </div>
        <main></main>
        <div class="controlsPanel">
            <div class="tab-list">
                <div class="tab active" onclick="openTab (event, 'setup-tab')">Setup</div>
                <div class="tab" onclick="openTab (event, 'controls-tab')">Controls</div>
                <div class="tab" onclick="openTab (event, 'solver-tab')">Solver</div>
                <div class="tab" onclick="openTab (event, 'algorithms-tab')">Algorithms</div>
            </div>
            <div class="tab-content" id="setup-tab" style="display: '';">
                <div class="tabHeader">
                    <h2>Cube Setup</h2>
                </div>
                <div class="controlHeader">
                    <h2>Common Rubik's Cubes</h2>
                    <!-- <span class="sectionToggleIcon">&#x25BE;</span> -->
                </div>
                <div class="collapsible-content">
                    <div class="stepList">
                        <div class="stepRow">
                            <div class="stepMainRow">
                                <button class="stepButton stage" onclick="setupCube (1)">Load 1x1 Rubik's Cube</button>
                            </div>
                        </div>
                        <div class="stepRow">
                            <div class="stepMainRow">
                                <button class="stepButton stage" onclick="setupCube (2)">Load 2x2 Rubik's Cube</button>
                            </div>
                        </div>
                        <div class="stepRow">
                            <div class="stepMainRow">
                                <button class="stepButton stage" onclick="setupCube (3)">Load 3x3 Rubik's Cube</button>
                            </div>
                        </div>
                        <div class="stepRow">
                            <div class="stepMainRow">
                                <button class="stepButton stage" onclick="setupCube (4)">Load 4x4 Rubik's Cube</button>
                            </div>
                        </div>
                        <div class="stepRow">
                            <div class="stepMainRow">
                                <button class="stepButton stage" onclick="setupCube (5)">Load 5x5 Rubik's Cube</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="controlHeader">
                    <h2>NxN Cubes</h2>
                </div>
                <div class="collapsible-content">
                    <p class="sectionDescription">Select the size of the NxN Rubik's Cube you want to load.</p>
                    <div class="stepList">
                        <div class="stepRow">
                            <div class="sliderContainer">
                                <div class="sliderLabel">
                                    N
                                </div>
                                <div class="sliderSliderContainer">
                                    <input class="sliderSlider" type="range" min="1" max="20" value="3" id="NSlider">
                                </div>
                                <div class="sliderTextboxContainer">
                                    <input class="sliderTextbox" type="number" min="1" max="20" value="3" id="NTextbox">
                                </div>
                            </div>
                        </div>
                        <div class="stepRow">
                            <div class="stepMainRow">
                                <button class="stepButton stage" onclick="setupNxNCube ()">Load NxN Rubik's Cube</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="tab-content" id="controls-tab" style="display: none;">
                <div class="tabHeader">
                    <h2>Cube Controls</h2>
                </div>
                <table class="controlGroup">
                    <tr class="controlRow">
                        <td colspan="2">
                            <button class="controlButton special" onclick="scramble()">Scramble</button>
                        </td>
                        <td colspan="2">
                            <button class="controlButton special" onclick="reset()">Reset</button>
                        </td>
                    </tr>
                </table>
                <table class="controlGroup" id="cubeControlsTable">
                    <!-- Cube controls will get populated here -->
                </table>
                <div class="sliderContainer">
                    <div class="sliderLabel">
                        Turn speed
                    </div>
                    <div class="sliderSliderContainer">
                        <input class="sliderSlider" type="range" min="1" max="90" value="5" id="turnSpeedSlider">
                    </div>
                    <div class="sliderTextboxContainer">
                        <input class="sliderTextbox" type="number" min="1" max="90" value="5" id="turnSpeedTextbox">
                    </div>
                </div>
            </div>
            <div class="tab-content" id="solver-tab" style="display: none;">
                <div class="tabHeader">
                    <h2>Solver Controls</h2>
                </div>
                <div id="solverTabContent">
                    <!-- Solver controls will get populated here -->
                </div>
            </div>
            <div class="tab-content" id="algorithms-tab" style="display: none;">
                <div class="tabHeader">
                    <h2>Algorithms</h2>
                </div>
                <div id="algorithmsTabContent">
                    <!-- Algorithm controls will get populated here -->
                </div>
            </div>
        </div>
    </body>
</html>
